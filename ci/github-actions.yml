# Copy to .github/workflows/harness-gates.yml in your project after ./harness.sh install.
name: harness-gates

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the diff-based gates need the target branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 14 harness gates
        run: bash gates/run-all.sh
        env:
          HARNESS_BASE: origin/${{ github.base_ref || 'main' }}
