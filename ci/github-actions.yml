# Copy to .github/workflows/harness-gates.yml in your project after ./harness.sh install.
name: harness-gates

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness gates (ADR numbers, error.md, AGENTS.md size)
        run: bash gates/run-all.sh
