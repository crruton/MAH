name: harness

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  barriers:
    name: 20 barriers block their attacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y jq
      - run: bash try-it.sh

  ste:
    name: agent-facing text follows ASD-STE100
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gates/check-ste.py --strict "skills/**/SKILL.md" templates/AGENTS.global.md templates/AGENTS.project.md templates/error.md templates/adr/index.md

  mcp:
    name: 10 MCP servers (mcp ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y jq
      - run: pip install "mcp${{ matrix.sdk }}" jsonschema
      - run: python mcp/selftest.py

  launcher:
    name: launcher end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y jq
      - name: start, incident, adr, lock, check
        run: |
          repo=$(mktemp -d)
          git -C "$repo" init -q -b dev
          git -C "$repo" -c user.email=ci@example.com -c user.name=ci commit -q --allow-empty -m "Start the repository"
          ./harness.sh start "$repo"
          ./harness.sh incident "$repo" "ci incident"
          ./harness.sh adr "$repo" "CI decision"
          adr="$repo/docs/adr/0001-ci-decision.md"
          sed -i 's#^- \*\*Applies To:\*\*.*#- **Applies To:** `src/**`#; s#^- \*\*Reconsider When:\*\*.*#- **Reconsider When:** RPS above 100#' "$adr"
          ./harness.sh check "$repo"
          test -f "$repo/docs/metrics.md"
      - name: syntax
        run: |
          for f in harness.sh install.sh try-it.sh gates/*.sh hooks/*.sh hooks/pre-push hooks/commit-msg; do bash -n "$f"; done
          python -m py_compile gates/*.py metrics/*.py mcp/selftest.py mcp/servers/*.py
